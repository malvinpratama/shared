name: shared
# Shared utilities package for the monorepo
# This package contains common utilities, helpers, and shared code
# that can be used across multiple Flutter applications and packages
# within the monorepo structure. It provides reusable components
# to maintain consistency and reduce code duplication.
description: "Shared utilities package for the monorepo. Contains common utilities, helpers, and shared code that can be used across multiple Flutter applications and packages within the monorepo structure."
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.2.0
  injectable: ^2.5.1
  equatable: ^2.0.7
  talker_flutter: ^5.0.1
  talker_bloc_logger: ^5.0.1
  talker_dio_logger: ^5.0.1
  firebase_analytics: ^12.0.3
  firebase_crashlytics: ^5.0.3
  shared_preferences: ^2.5.3
  go_router: ^16.2.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.0
  injectable_generator: ^2.8.1

